name: Codenotch
options:
  bundleIdPrefix: local.audited
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.6.0-safe.4"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Codenotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Providers
          - Model/Fixtures.swift
          - Sessions/AntigravityActivityMonitor.swift
          - Sessions/GeminiCLIActivityMonitor.swift
          - Sessions/GrokActivityMonitor.swift
          - Settings/ReleaseNotes.swift
          - Settings/WhatsNewView.swift
          - Settings/WhatsNewWindowController.swift
      - path: Sources/Providers/ClaudeProfile.swift
      - path: Sources/Providers/ClaudeUsageCLI.swift
      - path: Sources/Providers/CodexUsage.swift
      - path: Sources/Providers/CursorUsage.swift
      - path: Sources/Providers/GlyphOutline.swift
      - path: Sources/Providers/ProviderAccount.swift
      - path: Sources/Providers/ProviderGlyph.swift
      - path: Sources/Providers/SQLiteStore.swift
      - path: Sources/Providers/UsageProvider.swift
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Codenotch Safe
        CFBundleDisplayName: Codenotch Safe
        LSMinimumSystemVersion: "26.0"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.audited.codenotch
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CodenotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SafeTests
    dependencies:
      - target: Codenotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.audited.codenotch.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  Codenotch:
    build:
      targets:
        Codenotch: all
        CodenotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodenotchTests
