name: Safe CI

on:
  push:
    branches: [main, audit/safe-local]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and audited bundle
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version
          swiftc --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run safe unit tests
        run: make test-ci

      - name: Build distribution
        env:
          CODENOTCH_SIGNING_IDENTITY: "-"
        run: make safe-homebrew

      - name: Upload unpublished distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Codenotch-Safe-distribution
          path: |
            build/release/Codenotch-Safe-*-universal.dmg
            build/release/SHA256SUMS.txt
            build/homebrew-tap/Casks/codenotch-safe.rb
          if-no-files-found: error
